<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shorts Engine</title>
  <link rel="stylesheet" href="/web/css/style.css">
</head>
<body>
  <div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h1>Shorts Engine</h1>
        <p class="subtitle">Turn YouTube videos into viral vertical shorts &bull; GTA 6 clipping</p>
      </div>
      <div>
        <a href="/review" style="background: #1f2533; color: #93c5fd; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid #2e384d;">
          Clip Review &amp; Calibration &rarr;
        </a>
      </div>
    </header>

    <div id="sys-banner" class="banner"></div>

    <div class="card">
      <div class="form-group">
        <label for="url-input">YouTube URL</label>
        <input type="text" id="url-input" placeholder="Paste a YouTube video or finished livestream link">
      </div>

      <div class="form-group">
        <label class="checkbox-label" for="ack-fair-use">
          <input type="checkbox" id="ack-fair-use">
          <span>I understand I am responsible for deciding whether I may reuse this video. The tool adds credits and risk flags but does not give legal advice.</span>
        </label>
      </div>

      <div class="form-group">
        <button type="button" id="options-toggle" class="btn btn-secondary">Options</button>
      </div>

      <div id="options-panel" class="card" style="display: none; margin-top: 12px; background: #12141a;">
        <div class="form-group">
          <label for="opt-min-tier">Min Tier</label>
          <select id="opt-min-tier">
            <option value="A">A Tier (Top viral potential)</option>
            <option value="B">B Tier (Solid viral potential)</option>
            <option value="C" selected>C Tier (All acceptable clips)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="opt-max-clip-s">Max Clip Duration (seconds)</label>
          <input type="number" id="opt-max-clip-s" min="20" max="90" value="60">
        </div>

        <div class="form-group">
          <label for="opt-layout">Layout</label>
          <select id="opt-layout">
            <option value="auto" selected>Auto detect</option>
            <option value="gameplay">Gameplay (crop center)</option>
            <option value="facecam">Facecam split</option>
            <option value="talking_head">Talking head</option>
          </select>
        </div>

        <div class="form-group">
          <label class="checkbox-label" for="opt-effects">
            <input type="checkbox" id="opt-effects" checked>
            <span>AI Director &amp; Effects (zooms, arrows, hook card)</span>
          </label>
        </div>

        <div class="form-group">
          <label class="checkbox-label" for="opt-fast">
            <input type="checkbox" id="opt-fast">
            <span>Fast lane (batches of 6)</span>
          </label>
        </div>

        <div class="form-group">
          <label class="checkbox-label" for="opt-quality">
            <input type="checkbox" id="opt-quality">
            <span>Max quality (1440p)</span>
          </label>
        </div>

        <div class="form-group">
          <label class="checkbox-label" for="opt-second-look">
            <input type="checkbox" id="opt-second-look">
            <span>Second look pass (rescue borderline moments near threshold)</span>
          </label>
        </div>
      </div>

      <button type="button" id="start-btn" class="btn" disabled>Find viral clips</button>
    </div>

    <!-- Results Performance Summary (M5) -->
    <div id="results-card" class="card" style="display: none;">
      <h2 style="font-size: 18px; margin-bottom: 14px;">Top Performing Clips (Logged Analytics)</h2>
      <table id="results-list">
        <thead>
          <tr>
            <th>Clip</th>
            <th>Platform</th>
            <th>Views</th>
            <th>Likes</th>
            <th>Logged</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2 style="font-size: 18px; margin-bottom: 14px;">Recent Jobs</h2>
      <table id="jobs-list">
        <thead>
          <tr>
            <th>Title</th>
            <th>Channel</th>
            <th>Status</th>
            <th>Stage</th>
            <th>Clips</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="7" style="color: var(--muted); text-align: center; padding: 24px;">No jobs yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/web/js/home.js"></script>
</body>
</html>
