[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-engine"
version = "0.1.0"
description = "Turn one YouTube link into finished vertical shorts"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "app", "tests"]
exclude = ["scratch", "data", "output", ".venv", ".agents"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
