<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shorts Engine - Clip Review & Calibration</title>
  <style>
    :root {
      --bg: #0f1319;
      --card-bg: #181d27;
      --border: #2e384d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
    }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .nav-link {
      background: #1f2533;
      color: #93c5fd;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      opacity: 0.9;
    }
    pre {
      background: #0b0e14;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Shorts Engine - Clip Review & Calibration</h1>
        <p class="subtitle">Review rated clips and tune scoring weights with active learning</p>
      </div>
      <div>
        <a href="/web/index.html" class="nav-link">&larr; Back to Dashboard</a>
      </div>
    </header>

    <div class="card">
      <h2 style="margin-top: 0; font-size: 18px;">Scoring Model Calibration</h2>
      <p style="color: var(--muted); font-size: 14px;">
        Train logistic regression ranker on your feedback ratings to optimize weights across hook, payoff, and audio signals.
      </p>
      <button id="btn-calibrate" class="btn" onclick="runCalibration()">Calibrate Scoring Weights</button>
      <div id="calibration-result" style="margin-top: 16px; display: none;">
        <pre id="calibration-json"></pre>
      </div>
    </div>
  </div>

  <script>
    async function runCalibration() {
      const btn = document.getElementById("btn-calibrate");
      const resultBox = document.getElementById("calibration-result");
      const jsonBox = document.getElementById("calibration-json");
      btn.disabled = true;
      btn.innerText = "Calibrating...";
      try {
        const res = await fetch("/api/system/calibrate", { method: "POST" });
        const data = await res.json();
        resultBox.style.display = "block";
        jsonBox.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        resultBox.style.display = "block";
        jsonBox.innerText = "Error calibrating: " + err;
      } finally {
        btn.disabled = false;
        btn.innerText = "Calibrate Scoring Weights";
      }
    }
  </script>
</body>
</html>
